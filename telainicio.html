<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENAI INCLUSÃO - Tela de inicio</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
    /* mudando a tela principal */
   body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100vh;
    min-height: 100svh;

    font-family: Arial, sans-serif;
    background-color: black;

    display: flex;
    justify-content: center;
    align-items: flex-start;
}

    /*mudando para o formato mobile*/
form{
    background-color: #EEF4F8;
    padding : 2px;
    box-shadow: 0 0 20px color: green;
    width: 390px;
    height: 1136px;
}

 /* Cabeçalho para ficar alinhado um ao lado do outro*/
    .cabecalho {
        display: flex;
        justify-content: space-between;
        align-items: center;

        padding: 20px 12px;
    }

    /* Logo */
    .logo {
        display: flex;
        flex-direction: column;

        color: #174b9b;
        font-size: 23px;
        font-weight: 900;
        font-style: italic;
        line-height: 0.85;
        letter-spacing: -1px;
    }

    /* Botões à direita */
    .botoes-acessibilidade {
        display: flex;
        align-items: center;
        gap: 14px;
    }

    .botao-icone {
        width: 37px;
        height: 37px;

        display: flex;
        justify-content: center;
        align-items: center;

        background-color: #005bbb;
        color: white;

        border: 1px solid #E2E8F0;
        border-radius: 11px;

        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
    }


    /* Cabeçalho azul */
.boas-vindas {
    background-color: #0056B3;
    color: white;

    padding: 28px 32px 18px;
    border-radius: 0 0 24px 24px;
}

.boas-vindas p {
    font-size: 14px;
    margin: 1px 0 4px;
    color: #E2E8F0;
}

.boas-vindas h1 {
    font-size: 30px;
    margin: 0 0 4px;
    color: white;
}

.boas-vindas strong {
    font-size: 16px;
    margin-left: 3px;
}

/* Área abaixo do cabeçalho */
.conteudo-home {
    padding: 20px 24px;
}

/* Cartão Ver Rotas */
.cartao-rotas {
    position: relative;

    display: flex;
    align-items: flex-start;
    gap: 14px;

    padding: 28px 18px 22px;
    min-height: 200px;
    box-sizing: border-box;

    background-color: #eaf4fc;
    border: 1px solid #cfe5f7;
    border-radius: 28px;
    overflow: hidden;
}

/* Ícone do mapa */
.icone-mapa {
    width: 58px;
    height: 58px;
    min-width: 58px;

    display: flex;
    align-items: center;
    justify-content: center;

    background-color: #EAF4FC;
    border-radius: 50%;
    color: #006DB6;

    font-size: 30px;
}

/* Texto das rotas */
.informacoes-rotas {
    position: relative;
    z-index: 1;
    flex: 1;
    min-width: 0;
}

.informacoes-rotas h2 {
    color: #173e5e;
    font-size: 28px;
    margin: -5px 0 8px;
}

.informacoes-rotas p {
    color: #456987;
    font-size: 17px;
    line-height: 1.4;
    margin: 0 0 22px;
}

/* Botão Acessar Rotas */
.botao-rotas {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;

    background-color: white;
    color: #006cba;

    border: 2px solid #006DB6;
    border-radius: 40px;

    padding: 14px 18px;
    font-size: 17px;
    font-weight: bold;
    white-space: nowrap;
    cursor: pointer;
}

/* Ilustração decorativa à direita */

    .boas-vindas {
        padding-left: 22px;
        padding-right: 21px;
    }

    .cartao-rotas {
        gap: 12px;
        padding: 24px 14px;
    }

    .icone-mapa {
        width: 48px;
        height: 48px;
        min-width: 48px;
        font-size: 25px;
    }

    .informacoes-rotas h2 {
        font-size: 24px;
    }

    .informacoes-rotas p {
        font-size: 15px;
    }

    .botao-rotas {
        gap: 10px;
        width: 180px;
        padding: 12px;
        font-size: 14px;
    }

.interface {
    padding: 16px;
    box-sizing: border-box;
}

.titulo-secao {
    color: #10233f;
    font-size: 20px;
    margin: 0 0 12px;
}

/* Cartão de informações acadêmicas */
.calendario {
    display: flex;
    align-items: center;
    gap: 20px;

    width: 360px;
    height: 100px;
    min-height: 110px;
    padding: 16px;

    box-sizing: border-box;
    background-color: #0757b5;
    border-radius: 12px;
}

/* Botão com o ícone */
.icone-calendario {

    display: flex;
    align-items: center;
    justify-content: center;

    background-color: #286fba;
    color: white;
    border: none;
    border-radius: 24px;

    font-size: 32px;
    cursor: pointer;
}

/* Textos à direita do ícone */
.info-calendario {
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.info-calendario strong {
    color: white;
    font-size: 20px;
}

.info-calendario p {
    color: #d0e2f8;
    font-size: 12px;
    margin: 0;
}

    .icone-calendario {
        width: 64px;
        height: 72px;
        min-width: 70px;
        font-size: 28px;
    }

    .info-calendario strong {
        font-size: 20px;
        cursor: pointer;
    }

    
/* Área inferior da tela */
.rodape-home {
    width: 100%;
    margin-top: 10px;
    padding-top: 10px;
    box-sizing: border-box;
}

/* Botão grande de pedir ajuda */
.botao-pedir-ajuda {
    width: 80%;
    max-width: 310px;
    height: 155px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;

    padding-bottom: 25px;
    box-sizing: border-box;
    margin: 0 auto 9px;

    background-color: #0757b5;
    color: white;

    border: none;
    border-radius: 160px 160px 0 0;

    font-family: Arial, sans-serif;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
}

/* Ícone de telefone */
.botao-pedir-ajuda i {
    font-size: 46px;
}

/* Barra branca de navegação */
.menu-inferior {
    display: grid;
    grid-template-columns: 1fr 1.8fr 1fr;
    align-items: center;

    width: 100%;
    min-height: 74px;
    padding: 8px 4px;
    box-sizing: border-box;

    background-color: white;
}

/* Cada item da navegação */
.item-menu {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;

    color: #7290ad;
    text-decoration: none;
    text-align: center;

    font-size: 12px;
}

/* Ícones da navegação */
.item-menu i {
    font-size: 21px;
}

/* Item selecionado */
.item-menu.ativo {
    color: #0062c4;
}

/* Evita que o texto central quebre de forma estranha */
.item-menu:nth-child(2) span {
    white-space: nowrap;
    font-size: 11px;
}
    </style>
</head>
<body>
    
<form>

   <!--cabeçalho da tela-->
<header class="cabecalho">

    <div class="logo">
        <span>SENAI</span>
        <span>INCLUSÃO</span>
    </div>
<!--botões e icones-->
    <div class="botoes-acessibilidade">
        <button class="botao-icone">Aa</button>

        <button class="botao-icone" aria-label="Notificações">
        <i class="fa-solid fa-bell"></i>
        </button>
    </div>

</header>

<!--background dos boas vindas-->
<div class="boas-vindas">
    <p>Bom dia,</p>
    <h1>Olá,Jhon</h1>
    <strong>Matrícula 20241038</strong>
</div>

<!--parte do mapa(background) e seus icones alinhados-->
<div class="conteudo-home">

    <section class="cartao-rotas">

        <div class="icone-mapa">
            <i class="fa-regular fa-map"></i>
        </div>

        <div class="informacoes-rotas">
            <h2>Ver Rotas</h2>

            <p>
                Veja sua rota<br>
                para ver o seu destino na escola.
            </p>

            <button class="botao-rotas">
                Acessar Rotas ➜
            </button>
        </div>

    </section>

</div>

<!--parte dos atalhos para as opções-->

<div class="interface">
    <h3 class="titulo-secao">O que você precisa?</h3>
    
<div class="calendario">
    <div
        <button class="icone-calendario" -label="Calendário">
        <i class="fa-solid fa-calendar-days"></i>
        </button>
    </div>

    <div class="info-calendario">
        <strong>Informações acadêmica</strong>
        <p>Aulas e horários</p>
    </div>

</div>

<br>

<div class="calendario">
    <div
        <button class="icone-calendario" -label="Calendário">
        <i class="fa-solid fa-bell"></i>
        </button>
    </div>

    <div class="info-calendario">
        <strong>Comunicados</strong>
        <p>2 avisos novos</p>
    </div>

</div>

<br>

<div class="calendario">
    <div
        <button class="icone-calendario" -label="Calendário">
        <i class="fa-solid fa-universal-access"></i>
        </button>
    </div>

    <div class="info-calendario">
        <strong>Informações acadêmica</strong>
        <p>Aulas e horários</p>
    </div>
    

</div>
    </div>



    <div class="rodape-home">

    <button class="botao-pedir-ajuda">
        <i class="fa-solid fa-phone"></i>
        <span>Pedir Ajuda</span>
    </button>
    </div>


 <nav class="menu-inferior">
 
        <a href="#" class="item-menu ativo">
            <i class="fa-solid fa-house"></i>
            <span>Início</span>
        </a>

        <a href="#" class="item-menu">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span>Reporte de obstáculo</span>
        </a>

        <a href="#" class="item-menu">
            <i class="fa-regular fa-user"></i>
            <span>Perfil</span>
        </a>

    </nav>

</div>
    </div>
   


</form>

</div>

</body>
</html>
